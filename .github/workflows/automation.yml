name: KOC scheduled collection
on:
  workflow_dispatch:
    inputs:
      retry_brand_images:
        description: Retry previously unavailable brand images
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: koc-automation
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.KOC_AUTOMATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      KOC_GITHUB_REPO: ${{ github.repository }}
      KOC_REMOTE_STATE: github
      KOC_STATE_KEY: ${{ secrets.KOC_STATE_KEY }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      KOC_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/upstream
      KOC_PRIVATE_DIR: ${{ github.workspace }}/var/private
      KOC_TESSDATA_DIR: ${{ github.workspace }}/.runtime/tessdata
      UV_CACHE_DIR: ${{ github.workspace }}/var/uv-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify prerequisites and free runner
        run: |
          python - <<'PY'
          import os,json,urllib.request
          for name in ('KOC_STATE_KEY','FEISHU_APP_SECRET'):
              if not os.getenv(name): raise SystemExit('Missing runtime binding: '+name)
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['KOC_GITHUB_REPO'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as r: metadata=json.load(r)
          if metadata.get('private') is not False: raise SystemExit('Only public repositories with a standard runner are enabled')
          PY
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --no-dev
      - run: bash scripts/install_xhs.sh
      - run: bash scripts/install_ocr.sh
      - name: Retry brand image inspection when requested
        if: github.event_name == 'workflow_dispatch' && inputs.retry_brand_images
        run: uv run --frozen --no-dev koc identify-brands --retry-images
      - name: Execute due jobs and persist encrypted state
        run: |
          python - <<'PY'
          import json,re,subprocess,sys
          result=subprocess.run(['uv','run','--frozen','--no-dev','koc','run-once'],stderr=subprocess.PIPE,text=True)
          if result.returncode:
              codes=[]
              for line in result.stderr.splitlines():
                  try:
                      code=json.loads(line).get('error','')
                  except (ValueError,AttributeError):
                      continue
                  if isinstance(code,str) and re.fullmatch(r'[A-Z][A-Z0-9_]{0,100}',code): codes.append(code)
              print('::error::KOC runtime failed: '+(', '.join(codes) or 'UNCLASSIFIED_RUNTIME_FAILURE'))
          sys.exit(result.returncode)
          PY
